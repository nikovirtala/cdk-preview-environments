# ~~ Generated by projen. To modify, edit .projenrc.ts and run "pnpm exec projen".

name: destroy
on:
  pull_request:
    branches:
      - main
    types:
      - closed
jobs:
  destroy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      id-token: write
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        id: setup_pnpm
        uses: pnpm/action-setup@v6.0.10
        with:
          version: 11.20.0
      - name: Setup Node.js
        id: setup_node_js
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.2
      - name: Configure AWS credentials
        id: configure_aws_credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: eu-west-1
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-session-name: github-actions-session
      - name: Install Dependencies
        id: install_dependencies
        run: pnpm install --frozen-lockfile
      - name: Set CDK Application Stage
        id: stage
        run: echo ::set-output name=stage::"pr-${{ github.event.number }}"
      - name: Destroy
        id: destroy
        run: |-
          pnpm exec projen destroy \
            --context stage=${{ steps.stage.outputs.stage }} \
            --force
      - name: Deactivate GitHub Deployment
        id: deactivate_github_deployment
        uses: bobheadxi/deployments@v1
        with:
          step: deactivate-env
          token: ${{ secrets.GITHUB_TOKEN }}
          env: ${{ steps.stage.outputs.stage }}
          desc: environment deactivated after destroy
