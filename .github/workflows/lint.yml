name: lint
on:
  pull_request:
    branches:
      - main
jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        id: setup_pnpm
        uses: pnpm/action-setup@v6.0.10
        with:
          version: 11.20.0
      - name: Setup Node.js
        id: setup_node_js
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.2
      - name: Install Dependencies
        id: install_dependencies
        run: pnpm install --frozen-lockfile
      - name: Set CDK Application Stage
        id: stage
        run: |-
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo ::set-output name=stage::"prod"
          else
            echo ::set-output name=stage::"pr-${{ github.event.number }}"
          fi
      - name: Synth
        id: synth
        run: pnpm exec cdk synth --context stage=${{ steps.stage.outputs.stage }}
      - name: Lint
        id: lint
        uses: docker://ghcr.io/scottbrenner/cfn-lint-action:master
        with:
          args: -t cdk.out/**template.json -i E3002,E3003,W3005
